name: SoundMemory
options:
  bundleIdPrefix: com.soundmemory
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_IPAD: NO
    SUPPORTS_IPHONE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES

targets:
  SoundMemory:
    type: application
    platform: iOS
    sources:
      - path: SoundMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.j0schka.ohrenspiel
        INFOPLIST_FILE: SoundMemory/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SoundMemory/Info.plist
      properties:
        CFBundleDisplayName: Ohrenspiel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  SoundMemoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoundMemoryTests
    dependencies:
      - target: SoundMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.j0schka.ohrenspiel.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SoundMemory.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SoundMemory
